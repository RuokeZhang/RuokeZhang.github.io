<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClawsBench Trajectory Explorer</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: light-dark(#f6f7f9, #101214);
      --surface: light-dark(#ffffff, #191c1f);
      --surface-raised: light-dark(#ffffff, #202428);
      --foreground: light-dark(#18202a, #edf1f4);
      --muted: light-dark(#687381, #9da7b2);
      --border: light-dark(#dfe3e8, #343a40);
      --accent: light-dark(#315efb, #82a0ff);
      --accent-soft: light-dark(#edf1ff, #202b52);
      --danger: light-dark(#b42318, #ff8b82);
      --success: light-dark(#067647, #6ce9a6);
      --warning: light-dark(#b54708, #fdb022);
      --code: light-dark(#f4f6f8, #111416);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--foreground); }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    header { padding: 18px 22px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
    .subtitle { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .filters { display: grid; grid-template-columns: minmax(230px, 2fr) repeat(7, minmax(120px, 1fr)) auto; gap: 8px; padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .filters input, .filters select { min-width: 0; width: 100%; padding: 8px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--background); }
    .quiet-button { padding: 8px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-raised); }
    .summary { display: flex; flex-wrap: wrap; gap: 16px; padding: 8px 18px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
    .summary strong { color: var(--foreground); font-weight: 600; }
    main { display: grid; grid-template-columns: minmax(440px, 42%) minmax(520px, 58%); min-height: calc(100vh - 150px); }
    .list-panel { border-right: 1px solid var(--border); min-width: 0; }
    .table-head, .trial-row { display: grid; grid-template-columns: minmax(235px, 1.7fr) minmax(135px, 1fr) 75px 58px 75px; gap: 10px; align-items: center; }
    .table-head { padding: 9px 14px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); }
    .trial-row { width: 100%; text-align: left; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--border); background: transparent; }
    .trial-row:hover, .trial-row.selected { background: var(--accent-soft); }
    .primary { min-width: 0; }
    .task-name { display: block; overflow-wrap: anywhere; font-weight: 600; }
    .run-path, .secondary { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .agent-name { overflow-wrap: anywhere; }
    .reward { font-variant-numeric: tabular-nums; font-weight: 600; }
    .reward.negative { color: var(--danger); }
    .reward.perfect { color: var(--success); }
    .indicator { font-size: 12px; color: var(--muted); }
    .indicator.issue { color: var(--warning); font-weight: 600; }
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; }
    .pagination-controls { display: flex; gap: 6px; }
    .detail-panel { min-width: 0; background: var(--surface); }
    .empty { padding: 40px 24px; color: var(--muted); }
    .detail-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
    .detail-header h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .tabs { display: flex; gap: 2px; overflow-x: auto; padding: 8px 12px 0; border-bottom: 1px solid var(--border); }
    .tab { border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; background: transparent; white-space: nowrap; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { padding: 14px 18px 40px; }
    .timeline-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .timeline-actions { display: flex; gap: 6px; }
    details.step { border: 1px solid var(--border); border-radius: 7px; margin-bottom: 9px; background: var(--surface-raised); }
    details.step > summary { padding: 10px 12px; cursor: pointer; list-style-position: inside; }
    .step-summary { margin-left: 5px; }
    .step-body { padding: 0 12px 12px; }
    .step-section { margin-top: 12px; }
    .section-title { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    .tool-call, .observation { padding: 10px; margin-top: 7px; border-left: 3px solid var(--accent); background: var(--background); }
    .observation { border-left-color: var(--success); }
    .tool-heading { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    pre { margin: 0; padding: 10px; background: var(--code); color: var(--foreground); border-radius: 5px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; }
    .block-meta { display: flex; gap: 10px; margin: 9px 0 4px; color: var(--muted); font-size: 11px; }
    .cap { color: var(--warning); font-weight: 600; }
    .raw-details { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .raw-details pre { margin-top: 6px; }
    .notice { padding: 10px 12px; border-left: 3px solid var(--warning); background: var(--background); color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .loading { padding: 30px; color: var(--muted); }
    .error { color: var(--danger); }
    @media (max-width: 1050px) {
      .filters { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
      .filters input { grid-column: 1 / -1; }
      main { grid-template-columns: 1fr; }
      .list-panel { border-right: 0; border-bottom: 1px solid var(--border); }
    }
    @media (max-width: 620px) {
      .filters { grid-template-columns: 1fr 1fr; padding: 10px; }
      .filters input { grid-column: 1 / -1; }
      .table-head { display: none; }
      .trial-row { grid-template-columns: 1fr 64px; }
      .trial-row > :nth-child(2), .trial-row > :nth-child(4), .trial-row > :nth-child(5) { display: none; }
      header { padding-inline: 14px; }
      .tab-content { padding-inline: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ClawsBench Trajectory Explorer</h1>
    <div class="subtitle" id="dataset-subtitle">Loading published trajectories…</div>
  </header>

  <section class="filters" aria-label="Trajectory filters">
    <input id="search" type="search" placeholder="Search task, condition, model, run ID…">
    <select id="archive"><option value="">All archives</option></select>
    <select id="agent"><option value="">All harnesses</option></select>
    <select id="condition"><option value="">All conditions</option></select>
    <select id="task"><option value="">All tasks</option></select>
    <select id="reward-filter">
      <option value="">All rewards</option>
      <option value="negative">Negative</option>
      <option value="zero">Zero</option>
      <option value="partial">Partial (0–1)</option>
      <option value="perfect">Perfect (≥1)</option>
      <option value="missing">Missing</option>
    </select>
    <select id="command-filter">
      <option value="">All command records</option>
      <option value="incomplete">Has missing/opaque command</option>
      <option value="complete">Commands complete</option>
    </select>
    <select id="output-filter">
      <option value="">All output records</option>
      <option value="capped">Has cap-length output</option>
      <option value="uncapped">No cap-length output</option>
    </select>
    <button class="quiet-button" id="reset" type="button">Reset</button>
  </section>

  <section class="summary" id="summary" aria-live="polite"></section>

  <main>
    <section class="list-panel" aria-label="Trajectory list">
      <div class="table-head">
        <span>Task / run</span><span>Harness / model</span><span>Reward</span><span>Steps</span><span>Record</span>
      </div>
      <div id="trial-list"><div class="loading">Loading index…</div></div>
      <div class="pagination" id="pagination" hidden>
        <span id="page-label"></span>
        <div class="pagination-controls">
          <button class="quiet-button" id="previous-page" type="button">Previous</button>
          <button class="quiet-button" id="next-page" type="button">Next</button>
        </div>
      </div>
    </section>
    <section class="detail-panel" id="detail-panel" aria-live="polite">
      <div class="empty">Select a trajectory to inspect every recorded step and file.</div>
    </section>
  </main>

  <script>
    window.CLAWSBENCH_STATIC_DATA = true;
    const state = {
      trials: [],
      filtered: [],
      page: 0,
      pageSize: 50,
      selectedId: null,
      detail: null,
      activeTab: 'timeline'
    };
    const staticData = window.CLAWSBENCH_STATIC_DATA === true;

    const elements = {
      search: document.getElementById('search'),
      archive: document.getElementById('archive'),
      agent: document.getElementById('agent'),
      condition: document.getElementById('condition'),
      task: document.getElementById('task'),
      reward: document.getElementById('reward-filter'),
      command: document.getElementById('command-filter'),
      output: document.getElementById('output-filter'),
      list: document.getElementById('trial-list'),
      summary: document.getElementById('summary'),
      pagination: document.getElementById('pagination'),
      pageLabel: document.getElementById('page-label'),
      previous: document.getElementById('previous-page'),
      next: document.getElementById('next-page'),
      detail: document.getElementById('detail-panel'),
      subtitle: document.getElementById('dataset-subtitle')
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatJson(value) {
      return escapeHtml(JSON.stringify(value, null, 2));
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      if (!staticData) return response.json();
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('This browser does not support gzip streaming.');
      }
      const decompressed = response.body.pipeThrough(new DecompressionStream('gzip'));
      return new Response(decompressed).json();
    }

    function uniqueValues(key) {
      return [...new Set(state.trials.map(trial => trial[key]).filter(Boolean))].sort();
    }

    function fillSelect(select, values) {
      const first = select.options[0].outerHTML;
      select.innerHTML = first + values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('');
    }

    function rewardClass(reward) {
      if (reward === null) return '';
      if (reward < 0) return 'negative';
      if (reward >= 1) return 'perfect';
      return '';
    }

    function rewardLabel(trial) {
      return trial.has_reward ? (trial.reward === null ? 'n/a' : Number(trial.reward).toFixed(2)) : 'missing';
    }

    function matchesReward(trial, filter) {
      if (!filter) return true;
      if (filter === 'missing') return !trial.has_reward || trial.reward === null;
      if (trial.reward === null) return false;
      if (filter === 'negative') return trial.reward < 0;
      if (filter === 'zero') return trial.reward === 0;
      if (filter === 'partial') return trial.reward > 0 && trial.reward < 1;
      return trial.reward >= 1;
    }

    function applyFilters() {
      const query = elements.search.value.trim().toLowerCase();
      state.filtered = state.trials.filter(trial => {
        const searchable = `${trial.trajectory_id} ${trial.id} ${trial.task_name} ${trial.condition_name} ${trial.agent_name} ${trial.model_name}`.toLowerCase();
        return (!query || searchable.includes(query)) &&
          (!elements.archive.value || trial.archive_name === elements.archive.value) &&
          (!elements.agent.value || trial.agent_name === elements.agent.value) &&
          (!elements.condition.value || trial.condition_name === elements.condition.value) &&
          (!elements.task.value || trial.task_name === elements.task.value) &&
          matchesReward(trial, elements.reward.value) &&
          (!elements.command.value ||
            (elements.command.value === 'incomplete' && trial.incomplete_command_count > 0) ||
            (elements.command.value === 'complete' && trial.incomplete_command_count === 0)) &&
          (!elements.output.value ||
            (elements.output.value === 'capped' && trial.capped_output_count > 0) ||
            (elements.output.value === 'uncapped' && trial.capped_output_count === 0));
      });
      state.page = 0;
      renderList();
    }

    function renderSummary() {
      const negative = state.filtered.filter(trial => trial.reward !== null && trial.reward < 0).length;
      const incomplete = state.filtered.filter(trial => trial.incomplete_command_count > 0).length;
      const capped = state.filtered.filter(trial => trial.capped_output_count > 0).length;
      elements.summary.innerHTML = `
        <span><strong>${state.filtered.length.toLocaleString()}</strong> shown of ${state.trials.length.toLocaleString()}</span>
        <span><strong>${negative.toLocaleString()}</strong> negative reward</span>
        <span><strong>${incomplete.toLocaleString()}</strong> with missing/opaque commands</span>
        <span><strong>${capped.toLocaleString()}</strong> with cap-length outputs</span>`;
    }

    function renderList() {
      renderSummary();
      const start = state.page * state.pageSize;
      const pageTrials = state.filtered.slice(start, start + state.pageSize);
      if (!pageTrials.length) {
        elements.list.innerHTML = '<div class="empty">No trajectories match these filters.</div>';
      } else {
        elements.list.innerHTML = pageTrials.map(trial => `
          <button type="button" class="trial-row ${trial.id === state.selectedId ? 'selected' : ''}" data-id="${escapeHtml(trial.id)}">
            <span class="primary">
              <span class="task-name">${escapeHtml(trial.trajectory_id)} · ${escapeHtml(trial.task_name)}</span>
              <span class="run-path">${escapeHtml(trial.condition_name)} · ${escapeHtml(trial.run_name)}</span>
            </span>
            <span class="agent-name">${escapeHtml(trial.agent_name)}<span class="secondary">${escapeHtml(trial.model_name)}</span></span>
            <span class="reward ${rewardClass(trial.reward)}">${rewardLabel(trial)}</span>
            <span>${trial.step_count}</span>
            <span class="indicator ${trial.incomplete_command_count || trial.capped_output_count ? 'issue' : ''}">${trial.incomplete_command_count ? `${trial.incomplete_command_count} opaque` : 'command ok'}${trial.capped_output_count ? ` · ${trial.capped_output_count} capped` : ''}</span>
          </button>`).join('');
        elements.list.querySelectorAll('.trial-row').forEach(button => {
          button.addEventListener('click', () => selectTrial(button.dataset.id));
        });
      }
      const pageCount = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
      elements.pagination.hidden = state.filtered.length === 0;
      elements.pageLabel.textContent = `Page ${state.page + 1} of ${pageCount}`;
      elements.previous.disabled = state.page === 0;
      elements.next.disabled = state.page + 1 >= pageCount;
    }

    async function selectTrial(trialId) {
      state.selectedId = trialId;
      state.detail = null;
      renderList();
      elements.detail.innerHTML = '<div class="loading">Loading complete trajectory…</div>';
      const url = new URL(window.location.href);
      const selectedTrial = state.trials.find(trial => trial.id === trialId);
      url.searchParams.set('run', selectedTrial ? selectedTrial.trajectory_id : trialId);
      history.replaceState(null, '', url);
      try {
        if (staticData) {
          state.detail = await fetchJson(`data/trials/${selectedTrial.trajectory_id}.json.gz`);
          const [task, condition] = await Promise.all([
            fetchJson(state.detail.static_files.task),
            fetchJson(state.detail.static_files.condition)
          ]);
          state.detail.task = task;
          state.detail.condition_results = condition.value;
          state.detail.raw_files['results.json'] = condition.raw;
        } else {
          state.detail = await fetchJson(`/api/trial?id=${encodeURIComponent(trialId)}`);
        }
        state.activeTab = 'timeline';
        renderDetail();
      } catch (error) {
        elements.detail.innerHTML = `<div class="empty error">Failed to load trajectory: ${escapeHtml(error.message)}</div>`;
      }
    }

    function renderDetail() {
      const detail = state.detail;
      const metadata = detail.metadata;
      const tabs = [
        ['timeline', `Timeline (${detail.timeline.length})`],
        ['task', 'Task'],
        ['reward', 'Reward'],
        ['timing', 'Timing'],
        ['trajectory', 'Raw trajectory'],
        ['condition', 'Condition results'],
        ['files', 'Raw files']
      ];
      elements.detail.innerHTML = `
        <div class="detail-header">
          <h2>${escapeHtml(metadata.trajectory_id)} · ${escapeHtml(metadata.task_name)} · ${escapeHtml(metadata.run_name)}</h2>
          <div class="detail-meta">
            <span>${escapeHtml(metadata.experiment_name)}</span>
            <span>${escapeHtml(metadata.condition_name)}</span>
            <span>${escapeHtml(metadata.agent_name)} / ${escapeHtml(metadata.model_name)}</span>
            <span>reward ${metadata.reward === null ? 'missing' : escapeHtml(metadata.reward)}</span>
            <span>${metadata.tool_call_count} calls · ${metadata.observation_count} observations</span>
          </div>
        </div>
        <nav class="tabs" aria-label="Trajectory details">
          ${tabs.map(([id, label]) => `<button type="button" class="tab ${state.activeTab === id ? 'active' : ''}" data-tab="${id}">${label}</button>`).join('')}
        </nav>
        <div class="tab-content" id="tab-content"></div>`;
      elements.detail.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          state.activeTab = tab.dataset.tab;
          renderDetail();
        });
      });
      renderActiveTab();
    }

    function renderActiveTab() {
      const content = document.getElementById('tab-content');
      if (state.activeTab === 'timeline') renderTimeline(content);
      if (state.activeTab === 'task') renderTask(content);
      if (state.activeTab === 'reward') renderJsonDocument(content, state.detail.reward, 'No reward.json was recorded for this run.');
      if (state.activeTab === 'timing') renderJsonDocument(content, state.detail.timing, 'No timing.json was recorded for this run.');
      if (state.activeTab === 'trajectory') renderJsonDocument(content, state.detail.trajectory, 'No trajectory data.');
      if (state.activeTab === 'condition') renderJsonDocument(content, state.detail.condition_results, 'No condition results.json was recorded.');
      if (state.activeTab === 'files') renderRawFiles(content);
    }

    function renderTimeline(content) {
      content.innerHTML = `
        <div class="timeline-toolbar">
          <span>Nothing below is shortened by this viewer. “Possibly capped” marks lengths already present in the published archive.</span>
          <span class="timeline-actions">
            <button class="quiet-button" id="expand-all" type="button">Expand all</button>
            <button class="quiet-button" id="collapse-all" type="button">Collapse all</button>
          </span>
        </div>
        ${state.detail.timeline.map(step => {
          const hasOpaque = step.tool_calls.some(call => {
            const command = call.arguments && call.arguments.command;
            return !command || ['Edit', 'Skill', 'Task', 'Terminal', 'Write'].includes(command);
          });
          const hasCapped = step.observations.some(observation => observation.blocks.some(block => block.possibly_capped));
          return `
            <details class="step">
              <summary><span class="step-summary">#${escapeHtml(step.step_id)} · ${escapeHtml(step.source)} · ${step.tool_calls.length} call(s) · ${step.observations.length} observation(s)${hasOpaque ? ' · opaque command' : ''}${hasCapped ? ' · possibly capped output' : ''}</span></summary>
              <div class="step-body">
                ${step.message ? `<div class="step-section"><div class="section-title">Message</div><pre>${escapeHtml(step.message)}</pre></div>` : ''}
                ${step.tool_calls.length ? `<div class="step-section"><div class="section-title">Tool calls</div>${step.tool_calls.map(call => `
                  <div class="tool-call">
                    <div class="tool-heading"><span>function: ${escapeHtml(call.function_name)}</span><span>id: ${escapeHtml(call.tool_call_id)}</span></div>
                    <pre>${formatJson(call.arguments)}</pre>
                  </div>`).join('')}</div>` : ''}
                ${step.observations.length ? `<div class="step-section"><div class="section-title">Observations</div>${step.observations.map((observation, observationIndex) => `
                  <div class="observation">
                    ${observation.blocks.map((block, blockIndex) => `
                      <div class="block-meta"><span>result ${observationIndex + 1}, block ${blockIndex + 1}</span><span>${block.length.toLocaleString()} chars</span>${block.possibly_capped ? '<span class="cap">possibly capped in archive</span>' : ''}</div>
                      <pre>${escapeHtml(block.text)}</pre>`).join('')}
                    <details class="raw-details"><summary>Raw stored result</summary><pre>${formatJson(observation.raw)}</pre></details>
                  </div>`).join('')}</div>` : ''}
                <details class="raw-details"><summary>Raw stored step</summary><pre>${formatJson(step.raw)}</pre></details>
              </div>
            </details>`;
        }).join('')}`;
      document.getElementById('expand-all').addEventListener('click', () => content.querySelectorAll('details.step').forEach(step => step.open = true));
      document.getElementById('collapse-all').addEventListener('click', () => content.querySelectorAll('details.step').forEach(step => step.open = false));
    }

    function renderTask(content) {
      const task = state.detail.task;
      if (!task.text) {
        content.innerHTML = '<div class="empty">No matching local task.md was found.</div>';
        return;
      }
      content.innerHTML = `
        <div class="notice">This task file is a local companion source and was not stored inside the published trajectory archive.<br>${escapeHtml(task.source)}</div>
        <pre>${escapeHtml(task.text)}</pre>`;
    }

    function renderJsonDocument(content, value, missingMessage) {
      content.innerHTML = value === null ? `<div class="empty">${escapeHtml(missingMessage)}</div>` : `<pre>${formatJson(value)}</pre>`;
    }

    function renderRawFiles(content) {
      content.innerHTML = Object.entries(state.detail.raw_files).map(([name, rawText]) => `
        <details class="step" ${name === 'trajectory.json' ? 'open' : ''}>
          <summary><span class="step-summary">${escapeHtml(name)}${rawText === null ? ' · missing' : ` · ${rawText.length.toLocaleString()} chars`}</span></summary>
          <div class="step-body">${rawText === null ? '<div class="empty">Not recorded.</div>' : `<pre>${escapeHtml(rawText)}</pre>`}</div>
        </details>`).join('');
    }

    async function initialize() {
      try {
        const payload = await fetchJson(staticData ? 'data/index.json.gz' : '/api/index');
        state.trials = payload.trials;
        state.filtered = state.trials;
        elements.subtitle.textContent = `${state.trials.length.toLocaleString()} published trajectories · exact archived JSON with lazy detail loading`;
        fillSelect(elements.archive, uniqueValues('archive_name'));
        fillSelect(elements.agent, uniqueValues('agent_name'));
        fillSelect(elements.condition, uniqueValues('condition_name'));
        fillSelect(elements.task, uniqueValues('task_name'));
        renderList();
        const requestedRun = new URL(window.location.href).searchParams.get('run');
        const requestedTrial = state.trials.find(trial => trial.id === requestedRun || trial.trajectory_id === requestedRun);
        if (requestedTrial) selectTrial(requestedTrial.id);
      } catch (error) {
        elements.list.innerHTML = `<div class="empty error">Failed to load dataset index: ${escapeHtml(error.message)}</div>`;
      }
    }

    [elements.search, elements.archive, elements.agent, elements.condition, elements.task, elements.reward, elements.command, elements.output]
      .forEach(element => element.addEventListener(element === elements.search ? 'input' : 'change', applyFilters));
    document.getElementById('reset').addEventListener('click', () => {
      elements.search.value = '';
      [elements.archive, elements.agent, elements.condition, elements.task, elements.reward, elements.command, elements.output].forEach(select => select.value = '');
      applyFilters();
    });
    elements.previous.addEventListener('click', () => { state.page -= 1; renderList(); });
    elements.next.addEventListener('click', () => { state.page += 1; renderList(); });
    initialize();
  </script>
</body>
</html>
